spring:
  application:
    name: reloop-backend
  # Local development convenience: `backend/.env` (git-ignored, see backend/.env.example)
  # supplies JWT_SECRET plus any optional credentials, so `./mvnw spring-boot:run` works from
  # the backend directory without exporting anything in the shell. The file is optional —
  # real environment variables are the supported way to configure deployments.
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reloop_dev}
    username: ${DB_USERNAME:${user.name}}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

reloop:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 30
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    # Must be a model that is currently served by the Gemini API. Google shut down
    # gemini-2.0-flash on 2026-06-01, so the default is a current GA Flash model;
    # override with GEMINI_MODEL if you need a different one.
    # See https://ai.google.dev/gemini-api/docs/deprecations
    model: ${GEMINI_MODEL:gemini-3.6-flash}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    timeout-seconds: 30
  storage:
    type: ${STORAGE_TYPE:local}
    local-dir: ${STORAGE_LOCAL_DIR:./data/uploads}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080/uploads}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  # The calendar zone used to interpret bare dates the user supplies (recycling history
  # "from"/"to") and the collector's "today" figure. Instants stay in UTC; only calendar
  # days are resolved in this zone. Defaults to the operating region of the seeded network.
  timezone: ${RELOOP_TIMEZONE:Asia/Kolkata}
  dev-mode: ${RELOOP_DEV_MODE:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    app.reloop: DEBUG
