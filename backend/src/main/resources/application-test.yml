spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/reloop_test
    username: ${DB_USERNAME:${user.name}}
    password: ${DB_PASSWORD:}

reloop:
  jwt:
    secret: test-only-secret-key-for-reloop-integration-tests-0123456789abcdef
  # Pinned so calendar-day assertions do not depend on the host JVM's zone.
  timezone: Asia/Kolkata
  dev-mode: true
  storage:
    local-dir: ./target/test-uploads
    public-base-url: http://localhost:8080/uploads

logging:
  level:
    app.reloop: INFO
