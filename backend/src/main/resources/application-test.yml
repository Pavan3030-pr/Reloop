spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/reloop_test
    username: ${DB_USERNAME:${user.name}}
    password: ${DB_PASSWORD:}

reloop:
  jwt:
    secret: test-only-secret-key-for-reloop-integration-tests-0123456789abcdef
  # Pinned so calendar-day assertions do not depend on the host JVM's zone.
  timezone: Asia/Kolkata
  dev-mode: true
  # Off for the broad suites, which make many auth calls from one IP. The rate limiter itself is
  # exercised by AuthRateLimitTest, which turns it back on with a deliberately tiny limit.
  rate-limit:
    enabled: false
    auth-requests-per-minute: 30
  storage:
    local-dir: ./target/test-uploads
    public-base-url: http://localhost:8080/uploads

logging:
  level:
    app.reloop: INFO
