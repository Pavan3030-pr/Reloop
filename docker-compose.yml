# ReLoop — one-command local/full stack.
#
#   JWT_SECRET="$(openssl rand -base64 48)" docker compose up --build
#
# Then open http://localhost:5173. Set ADMIN_EMAIL / ADMIN_PASSWORD on the first run to bootstrap an
# administrator, and GEMINI_API_KEY to switch on the AI scanner. Every value below is overridable
# from the shell or a root .env file (see README).
name: reloop

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reloop
      POSTGRES_USER: reloop
      POSTGRES_PASSWORD: ${DB_PASSWORD:-reloop}
    volumes:
      - reloop-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reloop -d reloop"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/reloop
      DB_USERNAME: reloop
      DB_PASSWORD: ${DB_PASSWORD:-reloop}
      # Required: compose refuses to start without it rather than signing tokens with a default.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET, e.g. JWT_SECRET="$(openssl rand -base64 48)"}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      RELOOP_TIMEZONE: ${RELOOP_TIMEZONE:-Asia/Kolkata}
      # Uploaded images are served through the frontend's /uploads proxy, matching local dev.
      STORAGE_LOCAL_DIR: /var/reloop/uploads
      STORAGE_PUBLIC_BASE_URL: /uploads
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - reloop-uploads:/var/reloop/uploads
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  reloop-db:
  reloop-uploads:
