# ReLoop — one-command local/full stack.
#
#   cp .env.example .env   # then set DB_PASSWORD and JWT_SECRET
#   docker compose up --build
#
# The client is served at http://localhost:8081; nginx proxies /api and /uploads to the backend,
# and the API is also published on :8080 for Swagger (/swagger-ui.html) and direct calls.
name: reloop

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reloop
      POSTGRES_USER: reloop
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - reloop-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reloop -d reloop"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/reloop
      DB_USERNAME: reloop
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      # Required: compose refuses to start without it rather than signing tokens with a default.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env, e.g. openssl rand -base64 48}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      RELOOP_TIMEZONE: ${RELOOP_TIMEZONE:-Asia/Kolkata}
      # Uploaded images are written here and served through the frontend's /uploads proxy.
      STORAGE_LOCAL_DIR: /var/reloop/uploads
      STORAGE_PUBLIC_BASE_URL: /uploads
      # Trust the proxy's X-Forwarded-* headers (rate limiting and client address resolution).
      SERVER_FORWARD_HEADERS_STRATEGY: native
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - reloop-uploads:/var/reloop/uploads
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8081:80"
    restart: unless-stopped

volumes:
  reloop-db:
  reloop-uploads:
